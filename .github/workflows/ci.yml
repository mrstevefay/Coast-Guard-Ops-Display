name: ci
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/howth-cg-dashboard

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: test-build
    permissions:
      contents: read
      packages: write
    outputs:
      pushed: ${{ steps.meta.outputs.pushed }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Decide whether to push
        id: meta
        run: |
          # Push on the default branch and on tags; PRs and feature branches only build.
          if [ "${{ github.event_name }}" = "push" ] && { [ "${{ github.ref }}" = "refs/heads/${{ github.event.repository.default_branch }}" ] || [[ "${{ github.ref }}" == refs/tags/v* ]]; }; then
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          else
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          fi
          echo "sha=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
      - name: Login to GHCR
        if: steps.meta.outputs.pushed == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (and push on default branch / tags)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.meta.outputs.pushed == 'true' }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.meta.outputs.sha }}
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    # Pulls the fresh image on the Vultr VPS. Needs repo secrets:
    #   DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY (private key for that user)
    runs-on: ubuntu-latest
    needs: docker
    if: needs.docker.outputs.pushed == 'true'
    steps:
      - name: Check deploy secrets
        id: has
        env:
          H: ${{ secrets.DEPLOY_HOST }}
        run: echo "ok=$([ -n "$H" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Deploy over SSH
        if: steps.has.outputs.ok == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: /opt/howth-cg/deploy.sh
      - name: Skipped
        if: steps.has.outputs.ok != 'true'
        run: echo "DEPLOY_HOST not set; image pushed but not deployed."
