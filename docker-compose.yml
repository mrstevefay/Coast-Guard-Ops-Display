# Hosted deployment (Vultr VPS): app from GHCR behind Caddy with automatic TLS.
# Local development/single-box use: `docker compose -f docker-compose.dev.yml up`.
#
# On the VPS this file lives at /opt/howth-cg/docker-compose.yml next to
# config.yaml, Caddyfile, .env and deploy.sh (see deploy/ and docs/RUNBOOK.md).
services:
  app:
    image: ${IMAGE:-ghcr.io/mrstevefay/howth-cg-dashboard:latest}
    container_name: howth-cg-app
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: Europe/Dublin
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATA_DIR: /app/data
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - app-data:/app/data
    expose:
      - "8080"
    mem_limit: 768m
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  caddy:
    image: caddy:2-alpine
    container_name: howth-cg-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  app-data:
  caddy-data:
  caddy-config:
