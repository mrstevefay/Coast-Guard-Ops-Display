services:
  dashboard:
    build: .
    image: howth-cg-dashboard:latest
    container_name: howth-cg-dashboard
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Required for POST /api/callout and /api/standdown (Phase 2 bridge).
      CALLOUT_TOKEN: ${CALLOUT_TOKEN:-}
      # Optional: free key from https://aisstream.io enables the AIS panel.
      AISSTREAM_API_KEY: ${AISSTREAM_API_KEY:-}
      # Optional: still-image URL for the webcam panel.
      WEBCAM_IMAGE_URL: ${WEBCAM_IMAGE_URL:-}
      LOG_LEVEL: info
      TZ: Europe/Dublin
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - dashboard-data:/app/data
    # Pi 5 / NUC: keep memory bounded; the process sits around 80–120 MB.
    mem_limit: 512m
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  dashboard-data:
